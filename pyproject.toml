[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-transcribe"
version = "0.1.0"
description = "Fast local YouTube transcripts using YouTube's own caption tracks, with a whisper.cpp fallback"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
asr = []

# Not installed by `pip install`. In a uv checkout, `uv sync` installs this
# group by default (see [tool.uv] below), so rebuilding the project
# environment keeps the MLX tools that `--engine mlx` and the bundled
# tools/rewrite_with_local_model.py runner need. Apple silicon only.
[dependency-groups]
ai = [
  "mlx-lm>=0.32.2; sys_platform == 'darwin' and platform_machine == 'arm64' and python_version >= '3.11'",
  "mlx-whisper>=0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64' and python_version >= '3.11'",
]

[tool.uv]
default-groups = ["ai"]

[project.scripts]
ytt = "ytt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
# Keep in sync with requires-python: the CLI supports Python 3.8.
target-version = "py38"
line-length = 100
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "UP",  # pyupgrade (limited to what Python 3.8 supports)
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
  "RUF", # ruff-specific rules
]
ignore = [
  "E501",  # line length is handled by the formatter
  # The code base uses typing.List / Optional and %-formatting on purpose for
  # Python 3.8 support; rewriting them is churn with no behavior change.
  "UP006",
  "UP031",
  "UP045",
  # En dashes in caption text handling are intentional.
  "RUF001",
  # Ternaries are not always clearer than an if/else with comments.
  "SIM108",
]

[tool.ruff.lint.isort]
known-first-party = ["ytt"]

[tool.ruff.format]
quote-style = "double"
# Leave code samples in the docs as written.
exclude = ["*.md"]

[tool.codespell]
skip = "uv.lock,*.pbxproj"
