# [AI-GENERATED] Chatbox agent (claude-opus-5-5); pending human review.
# Runs the deterministic, network-free unit test suite on every push and PR.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint and format (pre-commit)
    # Runs the same hooks as pre-commit.ci, so the check also works while the
    # repository is private.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Install pre-commit
        run: python -m pip install pre-commit
      - name: Run hooks
        # swift-format needs a Swift toolchain; the macos-app job covers it.
        env:
          SKIP: swift-format
        run: pre-commit run --all-files --show-diff-on-failure --color always
      - name: Liquid Glass APIs only in GlassCompat.swift
        # Views use the GlassCompat helpers so macOS 14 and 15 keep a fallback.
        run: |
          if grep -rnE 'glassEffect|GlassEffectContainer|buttonStyle\(\.glass|Glass\.|macOS 26' \
              macos/YTTranscribeApp/Sources --include='*.swift' | grep -v '/GlassCompat.swift:'; then
            echo "::error::Call Liquid Glass APIs through the helpers in GlassCompat.swift."
            exit 1
          fi

  python-tests:
    name: Python ${{ matrix.python-version }} unit tests
    # ubuntu-22.04: Python 3.8 (pyproject minimum) is unavailable on 24.04 images.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: CLI smoke test
        run: ytt --version
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  macos-app:
    name: SwiftUI app build and XCTest
    # macos-26 ships Xcode 26, whose SDK has the Liquid Glass APIs.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Swift format check (warnings only)
        # Reports style drift without failing the build. Add --strict once the
        # sources have been formatted with `swift format`.
        run: swift format lint --recursive --configuration .swift-format macos
      - name: Build and test (unsigned)
        run: >
          xcodebuild test
          -project macos/YTTranscribeApp/YTTranscribeApp.xcodeproj
          -scheme YTTranscribeApp
          -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO
