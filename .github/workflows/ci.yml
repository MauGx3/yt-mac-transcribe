# [AI-GENERATED] Chatbox agent (claude-opus-5-5); pending human review.
# Runs the deterministic, network-free unit test suite on every push and PR.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python ${{ matrix.python-version }} unit tests
    # ubuntu-22.04: Python 3.8 (pyproject minimum) is unavailable on 24.04 images.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: CLI smoke test
        run: ytt --version
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
